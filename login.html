
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Care Companion | Login</title>

<!-- GOOGLE FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/svg+xml" href="images/v1.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<!-- BOOTSTRAP ICONS -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
    --primary:#479899;
    --primary-dark:#367879;
    --primary-soft:rgba(71,152,153,.12);

    --secondary:#E89651;
    --secondary-soft:rgba(232,150,81,.13);

    --bg:#f7fbfa;
    --surface:#ffffff;
    --surface-soft:#f4f8f7;

    --text:#292535;
    --text-soft:#73767d;
    --border:#e3e9e7;

    --shadow:
        0 35px 90px rgba(37,72,72,.16),
        0 10px 30px rgba(37,72,72,.08);

    --radius:30px;

    --transition:.3s ease;
}


/* =========================================================
   DARK MODE
========================================================= */

html.dark{
    --bg:#091212;
    --surface:#111c1c;
    --surface-soft:#172525;

    --text:#f2f7f6;
    --text-soft:#a8b7b5;
    --border:#293b3a;

    --primary-soft:rgba(71,152,153,.16);
    --secondary-soft:rgba(232,150,81,.15);

    --shadow:
        0 35px 90px rgba(0,0,0,.45),
        0 10px 35px rgba(0,0,0,.25);
}


/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:"Inter",sans-serif;
    background:var(--bg);
    color:var(--text);
}


/* =========================================================
   MAIN AUTH AREA
========================================================= */

.auth-page{
    width:100%;
    height:110svh;
    min-height:100%;
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:30px;

    overflow:hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

.auth-bg{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.auth-bg::before{
    content:"";
    position:absolute;
    width:700px;
    height:720px;

    top:-320px;
    left:-250px;

    background:
        radial-gradient(
            circle,
            rgba(71,152,153,.20),
            transparent 68%
        );

    filter:blur(10px);
}

.auth-bg::after{
    content:"";
    position:absolute;

    width:650px;
    height:650px;

    right:-260px;
    bottom:-300px;

    background:
        radial-gradient(
            circle,
            rgba(232,150,81,.16),
            transparent 68%
        );

    filter:blur(10px);
}


/* =========================================================
   DECORATIVE ORBS
========================================================= */

.orb{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    opacity:.5;
}

.orb-one{
    width:90px;
    height:90px;

    top:13%;
    right:13%;

    background:rgba(71,152,153,.08);

    animation:floatOne 8s ease-in-out infinite;
}

.orb-two{
    width:55px;
    height:55px;

    bottom:14%;
    left:12%;

    background:rgba(232,150,81,.10);

    animation:floatTwo 7s ease-in-out infinite;
}

@keyframes floatOne{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-18px);
    }
}

@keyframes floatTwo{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(16px);
    }
}


/* =========================================================
   TOP CONTROLS
========================================================= */

.top-controls{
    position:absolute;

    top:24px;
    right:28px;

    display:flex;
    align-items:center;
    gap:10px;

    z-index:20;
}

.control-btn{
    width:42px;
    height:42px;

    border:1px solid var(--border);
    border-radius:13px;

    background:rgba(255,255,255,.72);

    backdrop-filter:blur(12px);

    color:var(--text);

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    font-size:17px;

    transition:var(--transition);
}

html.dark .control-btn{
    background:rgba(17,28,28,.82);
}

.control-btn:hover{
    transform:translateY(-2px);

    border-color:var(--primary);

    color:var(--primary);
}


/* =========================================================
   LOGIN CARD
   TALL PREMIUM VERSION
========================================================= */

.login-card{

    position:relative;
    z-index:5;

    width:min(100%,500px);

    /*
       INCREASED HEIGHT
    */

    min-height:720px;

    padding:42px 48px 40px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.98),
            rgba(249,252,251,.97)
        );

    border:1px solid rgba(255,255,255,.8);

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    backdrop-filter:blur(22px);

    display:flex;
    flex-direction:column;

    justify-content:center;

    overflow:hidden;
}

html.dark .login-card{
    background:
        linear-gradient(
            145deg,
            rgba(17,28,28,.98),
            rgba(13,24,24,.98)
        );

    border-color:rgba(255,255,255,.05);
}


/* =========================================================
   CARD TOP GLOW
========================================================= */

.login-card::before{
    content:"";

    position:absolute;

    width:240px;
    height:240px;

    top:-130px;
    right:-100px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(71,152,153,.14),
            transparent 70%
        );

    pointer-events:none;
}


/* =========================================================
   BRAND
========================================================= */

.brand{
    text-decoration:none;
    color:inherit;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:14px;

    margin-bottom:30px;
}

.logo-box{
    width:68px;
    height:68px;

    flex-shrink:0;

    border-radius:19px;

    overflow:hidden;

    background:var(--surface-soft);

    border:1px solid var(--border);

    box-shadow:
        0 12px 25px rgba(71,152,153,.15);

    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-box img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.brand-text{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.brand-name{
    font-family:"Playfair Display",serif;

    font-size:27px;
    line-height:1.1;

    font-weight:600;

    letter-spacing:-.5px;
}

.brand-primary{
    color:var(--primary);
}

.brand-secondary{
    color:var(--secondary);
}

.brand-tag{
    font-size:10px;

    color:var(--secondary);

    letter-spacing:1.2px;

    text-transform:uppercase;
}


/* =========================================================
   INTRO
========================================================= */

.login-intro{
    text-align:center;

    margin-bottom:28px;
}

.login-intro .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;

    color:var(--primary);

    font-size:11px;
    font-weight:700;

    letter-spacing:1.5px;

    text-transform:uppercase;

    margin-bottom:9px;
}

.eyebrow-line{
    width:22px;
    height:1px;

    background:var(--secondary);
}

.login-intro h1{
    font-family:"Playfair Display",serif;

    font-size:35px;

    line-height:1.15;

    font-weight:600;

    letter-spacing:-.7px;

    margin-bottom:9px;
}

.login-intro p{
    color:var(--text-soft);

    font-size:13px;

    line-height:1.6;

    max-width:330px;

    margin:auto;
}


/* =========================================================
   FORM
========================================================= */

.login-form{
    width:100%;
}

.form-group{
    margin-bottom:17px;
}

.form-label{
    display:block;

    margin-bottom:8px;

    font-size:12px;

    font-weight:600;

    color:var(--text);
}

.input-wrapper{
    position:relative;
}

.input-icon{
    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    color:var(--text-soft);

    font-size:16px;

    pointer-events:none;

    transition:var(--transition);
}

html[dir="rtl"] .input-icon{
    left:auto;
    right:15px;
}

.form-input{

    width:100%;
    height:50px;

    border:1px solid var(--border);

    border-radius:14px;

    outline:none;

    background:var(--surface-soft);

    color:var(--text);

    padding:0 44px;

    font-family:inherit;

    font-size:13px;

    transition:var(--transition);
}

.form-input::placeholder{
    color:#9aa4a2;
}

.form-input:focus{
    border-color:var(--primary);

    background:var(--surface);

    box-shadow:
        0 0 0 4px rgba(71,152,153,.10);
}

.form-input:focus + .input-icon{
    color:var(--primary);
}


/* =========================================================
   PASSWORD BUTTON
========================================================= */

.password-toggle{
    position:absolute;

    right:14px;
    top:50%;

    transform:translateY(-50%);

    border:0;
    background:transparent;

    color:var(--text-soft);

    cursor:pointer;

    font-size:17px;

    padding:4px;
}

html[dir="rtl"] .password-toggle{
    right:auto;
    left:14px;
}

.password-toggle:hover{
    color:var(--primary);
}


/* =========================================================
   REMEMBER / FORGOT
========================================================= */

.form-options{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin:3px 0 20px;
}

.remember{
    display:flex;
    align-items:center;

    gap:8px;

    font-size:11.5px;

    color:var(--text-soft);

    cursor:pointer;
}

.remember input{
    width:15px;
    height:15px;

    accent-color:var(--primary);

    cursor:pointer;
}

.forgot{
    color:var(--primary);

    font-size:11.5px;

    font-weight:600;

    text-decoration:none;

    white-space:nowrap;
}

.forgot:hover{
    color:var(--secondary);
}


/* =========================================================
   PRIMARY BUTTON
========================================================= */

.login-btn{

    width:100%;
    height:51px;

    border:0;
    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            #3f898a
        );

    color:white;

    font-family:inherit;

    font-size:13px;

    font-weight:700;

    letter-spacing:.2px;

    cursor:pointer;

    box-shadow:
        0 12px 25px rgba(71,152,153,.22);

    transition:var(--transition);

    position:relative;

    overflow:hidden;
}

.login-btn::before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.18),
            transparent
        );

    transition:.6s;
}

.login-btn:hover::before{
    left:100%;
}

.login-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 17px 32px rgba(71,152,153,.30);
}

.login-btn:active{
    transform:translateY(0);
}


/* =========================================================
   DIVIDER
========================================================= */

.divider{

    display:flex;

    align-items:center;

    gap:12px;

    margin:23px 0 17px;

    color:var(--text-soft);

    font-size:10px;

    letter-spacing:.7px;

    text-transform:uppercase;
}

.divider::before,
.divider::after{

    content:"";

    flex:1;

    height:1px;

    background:var(--border);
}


/* =========================================================
   SOCIAL BUTTONS
========================================================= */

.social-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:11px;
}

.social-btn{

    height:46px;

    border:1px solid var(--border);

    border-radius:13px;

    background:var(--surface);

    color:var(--text);

    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    font-family:inherit;

    font-size:12px;

    font-weight:600;

    cursor:pointer;

    transition:var(--transition);
}

.social-btn:hover{
    border-color:var(--primary);

    background:var(--primary-soft);

    transform:translateY(-2px);
}

.social-google i{
    color:#4285F4;
}

.social-apple i{
    color:var(--text);
}


/* =========================================================
   SIGN UP
========================================================= */

.signup-line{

    text-align:center;

    margin-top:22px;

    font-size:12px;

    color:var(--text-soft);
}

.signup-line a{
    color:var(--primary);

    font-weight:700;

    text-decoration:none;

    margin-left:4px;
}

.signup-line a:hover{
    color:var(--secondary);
}


/* =========================================================
   SECURITY NOTE
========================================================= */

.security-note{

    display:flex;

    justify-content:center;
    align-items:center;

    gap:7px;

    margin-top:19px;

    font-size:9.5px;

    color:var(--text-soft);

    letter-spacing:.2px;
}

.security-note i{
    color:var(--primary);

    font-size:12px;
}


/* =========================================================
   RTL
========================================================= */

html[dir="rtl"] .form-label{
    text-align:right;
}

html[dir="rtl"] .form-options{
    direction:rtl;
}

html[dir="rtl"] .signup-line{
    direction:rtl;
}


/* =========================================================
   TABLET
========================================================= */

@media (min-width:600px) and (max-width:850px){

    .auth-page{
        padding:24px;
    }

    .login-card{
        width:min(100%,540px);

        min-height:760px;

        padding:44px 52px;
    }

    .logo-box{
        width:72px;
        height:72px;
    }

    .brand-name{
        font-size:29px;
    }

    .login-intro h1{
        font-size:38px;
    }

    .form-input{
        height:53px;
    }

    .login-btn{
        height:54px;
    }
}


/* =========================================================
   SAMSUNG GALAXY S8 / SMALL MOBILE
========================================================= */

@media (max-width:480px){

    .auth-page{
        padding:15px;
    }

    .top-controls{
        top:12px;
        right:14px;

        gap:6px;
    }

    .control-btn{
        width:36px;
        height:36px;

        border-radius:11px;

        font-size:15px;
    }

    .login-card{

        width:100%;

        min-height:0;

        height:auto;

        max-height:calc(100svh - 30px);

        padding:27px 24px 25px;

        border-radius:24px;

        justify-content:flex-start;

        overflow:hidden;
    }

    .brand{
        margin-bottom:19px;

        gap:10px;
    }

    .logo-box{
        width:52px;
        height:52px;

        border-radius:15px;
    }

    .brand-name{
        font-size:22px;
    }

    .brand-tag{
        font-size:12px;

        letter-spacing:.9px;
    }

    .login-intro{
        margin-bottom:19px;
    }

    .login-intro .eyebrow{
        font-size:12px;

        margin-bottom:6px;
    }

    .login-intro h1{
        font-size:32px;

        margin-bottom:6px;
    }

    .login-intro p{
        font-size:14px;

        line-height:1.45;
    }

    .form-group{
        margin-bottom:12px;
    }

    .form-label{
        font-size:14.5px;

        margin-bottom:6px;
    }

    .form-input{
        height:44px;

        border-radius:12px;

        font-size:14.5px;

        padding-left:40px;
        padding-right:40px;
    }

    html[dir="rtl"] .form-input{
        padding-left:40px;
        padding-right:40px;
    }

    .input-icon{
        left:13px;

        font-size:18px;
    }

    html[dir="rtl"] .input-icon{
        left:auto;
        right:13px;
    }

    .password-toggle{
        right:11px;

        font-size:18px;
    }

    html[dir="rtl"] .password-toggle{
        right:auto;
        left:11px;
    }

    .form-options{
        margin:2px 0 14px;
    }

    .remember,
    .forgot{
        font-size:14px;
    }

    .login-btn{
        height:45px;

        border-radius:12px;

        font-size:14.5px;
    }

    .divider{
        margin:17px 0 12px;

        font-size:12px;
    }

    .social-grid{
        gap:8px;
    }

    .social-btn{
        height:40px;

        border-radius:11px;

        font-size:12px;
    }

    .signup-line{
        margin-top:15px;

        font-size:12.5px;
    }

    .security-note{
        margin-top:12px;

        font-size:12px;
    }
}


/* =========================================================
   GALAXY S8 HEIGHT-SAFE MODE
========================================================= */

@media (max-width:480px) and (max-height:760px){

    .login-card{
        padding-top:22px;
        padding-bottom:20px;
    }

    .brand{
        margin-bottom:14px;
    }

    .logo-box{
        width:48px;
        height:48px;
    }

    .brand-name{
        font-size:20px;
    }

    .login-intro{
        margin-bottom:15px;
    }

    .login-intro h1{
        font-size:25px;
    }

    .login-intro p{
        font-size:10px;
    }

    .form-group{
        margin-bottom:9px;
    }

    .form-input{
        height:41px;
    }

    .login-btn{
        height:42px;
    }

    .divider{
        margin:13px 0 10px;
    }

    .social-btn{
        height:37px;
    }

    .signup-line{
        margin-top:12px;
    }

    .security-note{
        margin-top:9px;
    }
}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media (max-width:360px){

    .auth-page{
        padding:10px;
    }

    .top-controls{
        top:9px;
        right:10px;
    }

    .control-btn{
        width:33px;
        height:33px;

        font-size:13px;
    }

    .login-card{
        padding:20px 19px 18px;

        border-radius:21px;
    }

    .brand{
        margin-bottom:12px;
    }

    .logo-box{
        width:44px;
        height:44px;
    }

    .brand-name{
        font-size:19px;
    }

    .brand-tag{
        font-size:7px;
    }

    .login-intro h1{
        font-size:23px;
    }

    .login-intro p{
        font-size:9.5px;
    }

    .form-input{
        height:39px;

        font-size:10.5px;
    }

    .login-btn{
        height:40px;
    }

    .social-btn{
        height:35px;

        font-size:9px;
    }
}


/* =========================================================
   NEST HUB / SHORT DESKTOP
   1024 × 600
========================================================= */

@media (min-width:850px) and (max-height:700px){

    .auth-page{
        padding:18px;
        height: 300px;
    }

    .top-controls{
        top:14px;
        right:18px;
    }

    .login-card{

        width:480px;
        height: 580px;

        min-height:0;

        height:calc(100svh - 36px);

        max-height:570px;

        padding:25px 43px;

        justify-content:flex-start;

        overflow:hidden;
    }

    .brand{
        margin-bottom:14px;
    }

    .logo-box{
        width:50px;
        height:50px;
    }

    .brand-name{
        font-size:24px;
    }

    .brand-tag{
        font-size:12px;
    }

    .login-intro{
        margin-bottom:15px;
    }

    .login-intro h1{
        font-size:29px;
    }

    .login-intro p{
        font-size:14.5px;
    }

    .form-group{
        margin-bottom:9px;
    }

    .form-label{
        font-size:14px;

        margin-bottom:5px;
    }

    .form-input{
        height:40px;

        font-size:14px;
    }

    .login-btn{
        height:42px;
    }

    .divider{
        margin:13px 0 10px;
    }

    .social-btn{
        height:37px;
    }

    .signup-line{
        margin-top:12px;
    }

    .security-note{
        margin-top:8px;
    }
}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media (max-height:500px) and (orientation:landscape){

    .auth-page{
        padding:10px;
    }

    .top-controls{
        top:8px;
        right:10px;
    }

    .login-card{

        min-height:0;

        height:calc(100svh - 20px);

        max-height:none;

        padding:14px 30px;

        justify-content:flex-start;

        overflow:hidden;

        border-radius:20px;
    }

    .brand{
        margin-bottom:8px;
    }

    .logo-box{
        width:36px;
        height:36px;
    }

    .brand-name{
        font-size:17px;
    }

    .brand-tag{
        font-size:6px;
    }

    .login-intro{
        margin-bottom:8px;
    }

    .login-intro .eyebrow{
        display:none;
    }

    .login-intro h1{
        font-size:20px;

        margin-bottom:3px;
    }

    .login-intro p{
        display:none;
    }

    .form-group{
        margin-bottom:6px;
    }

    .form-label{
        display:none;
    }

    .form-input{
        height:32px;
    }

    .form-options{
        margin:2px 0 7px;
    }

    .login-btn{
        height:34px;
    }

    .divider{
        margin:7px 0 6px;
    }

    .social-btn{
        height:30px;
    }

    .signup-line{
        margin-top:6px;
    }

    .security-note{
        display:none;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}

</style>
</head>


<body>

<main class="auth-page">

    <!-- BACKGROUND -->
    <div class="auth-bg"></div>

    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>


    <!-- TOP CONTROLS -->
    <div class="top-controls">

        <button
            class="control-btn"
            id="directionBtn"
            type="button"
            aria-label="Change direction">

            <i class="bi bi-arrow-left-right"></i>

        </button>


        <button
            class="control-btn"
            id="themeBtn"
            type="button"
            aria-label="Toggle dark mode">

               <i data-lucide="moon"></i>


        </button>

    </div>


    <!-- LOGIN CARD -->
    <section class="login-card">


        <!-- BRAND -->
        <a href="index.html" class="brand">

            <div class="logo-box image-logo">

                <img
                    src="images/v1.png"
                    alt="Care Companion">

            </div>


            <div class="brand-text">

                <span class="brand-name">

                    <span class="brand-primary">
                        Care
                    </span>

                    <span class="brand-secondary">
                        Companion
                    </span>

                </span>


                <span class="brand-tag">
                    Compassion • Trust • Care
                </span>

            </div>

        </a>



        <!-- INTRO -->
        <div class="login-intro">

            <div class="eyebrow">

                <span class="eyebrow-line"></span>

                MEMBER ACCESS

                <span class="eyebrow-line"></span>

            </div>


            <h1>
                Welcome Back
            </h1>


            <p>
                Sign in to continue your personalized
                care journey with Care Companion.
            </p>

        </div>



        <!-- LOGIN FORM -->
        <form class="login-form" id="loginForm">


            <!-- EMAIL -->
            <div class="form-group">

                <label
                    class="form-label"
                    for="email">

                    Email Address

                </label>


                <div class="input-wrapper">

                    <input
                        class="form-input"
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required>


                    <i class="bi bi-envelope input-icon"></i>

                </div>

            </div>



            <!-- PASSWORD -->
            <div class="form-group">

                <label
                    class="form-label"
                    for="password">

                    Password

                </label>


                <div class="input-wrapper">

                    <input
                        class="form-input"
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>


                    <i class="bi bi-lock input-icon"></i>


                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>



            <!-- OPTIONS -->
            <div class="form-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember">

                    <span>
                        Remember Me
                    </span>

                </label>


                <a
                    href="forgot-password.html"
                    class="forgot">

                    Forgot Password?

                </a>

            </div>



            <!-- LOGIN BUTTON -->
            <button
                type="submit"
                class="login-btn">

                Login

            </button>



            <!-- DIVIDER -->
            <div class="divider">

                <span>
                    Or continue with
                </span>

            </div>



            <!-- SOCIAL -->
            <div class="social-grid">

                <button
                    type="button"
                    class="social-btn social-google"
                    id="googleBtn">

                    <i class="bi bi-google"></i>

                    <span>
                        Google
                    </span>

                </button>


                <button
                    type="button"
                    class="social-btn social-apple"
                    id="appleBtn">

                    <i class="bi bi-apple"></i>

                    <span>
                        Apple
                    </span>

                </button>

            </div>



            <!-- SIGN UP -->
            <div class="signup-line">

                <span>
                    Don't have an account?
                </span>

                <a href="signup.html">
                    Create Account
                </a>

            </div>



            <!-- SECURITY -->
          

        </form>

    </section>

</main>



<script>

/* =========================================================
   DARK MODE
========================================================= */

const themeBtn =
    document.getElementById("themeBtn");

const themeIcon =
    themeBtn.querySelector("i");


function updateThemeIcon(){

    if(document.documentElement.classList.contains("dark")){

        themeIcon.className =
            "bi bi-sun";

    }else{

        themeIcon.className =
            "bi bi-moon";

    }

}


if(localStorage.getItem("care-theme") === "dark"){

    document.documentElement.classList.add("dark");

}

updateThemeIcon();


themeBtn.addEventListener("click", function(){

    document.documentElement.classList.toggle("dark");

    const isDark =
        document.documentElement.classList.contains("dark");

    localStorage.setItem(
        "care-theme",
        isDark ? "dark" : "light"
    );

    updateThemeIcon();

});



/* =========================================================
   RTL / LTR
========================================================= */

const directionBtn =
    document.getElementById("directionBtn");


if(localStorage.getItem("care-direction") === "rtl"){

    document.documentElement.dir = "rtl";

}else{

    document.documentElement.dir = "ltr";

}


directionBtn.addEventListener("click", function(){

    const current =
        document.documentElement.dir;

    const next =
        current === "ltr"
        ? "rtl"
        : "ltr";

    document.documentElement.dir = next;

    localStorage.setItem(
        "care-direction",
        next
    );

});



/* =========================================================
   PASSWORD VISIBILITY
========================================================= */

const password =
    document.getElementById("password");

const passwordToggle =
    document.getElementById("passwordToggle");

const passwordIcon =
    passwordToggle.querySelector("i");


passwordToggle.addEventListener("click", function(){

    const isPassword =
        password.type === "password";


    password.type =
        isPassword ? "text" : "password";


    passwordIcon.className =
        isPassword
        ? "bi bi-eye-slash"
        : "bi bi-eye";


    passwordToggle.setAttribute(
        "aria-label",
        isPassword
        ? "Hide password"
        : "Show password"
    );

});



/* =========================================================
   LOGIN FORM
========================================================= */

const loginForm =
    document.getElementById("loginForm");


loginForm.addEventListener("submit", function(event){

    event.preventDefault();


    const email =
        document.getElementById("email").value.trim();

    const passwordValue =
        document.getElementById("password").value.trim();


    if(!email || !passwordValue){

        alert("Please enter your email and password.");

        return;

    }


    /*
       Connect your real authentication
       API / Firebase / backend here.
    */

    console.log(
        "Login submitted:",
        email
    );

});



/* =========================================================
   GOOGLE LOGIN
========================================================= */

document
.getElementById("googleBtn")
.addEventListener("click", function(){

    /*
       Connect Google OAuth here.
    */

    console.log("Google Sign In");

});



/* =========================================================
   APPLE LOGIN
========================================================= */

document
.getElementById("appleBtn")
.addEventListener("click", function(){

    /*
       Connect Apple OAuth here.
    */

    console.log("Apple Sign In");

});

</script>
<script>

/* =========================================================
   INITIALIZE LUCIDE
========================================================= */

if (typeof lucide !== "undefined") {
    lucide.createIcons();
}


/* =========================================================
   ELEMENTS
========================================================= */

const header =
    document.getElementById("header");

const menuBtn =
    document.getElementById("menuBtn");

const mobilePanel =
    document.getElementById("mobilePanel");

const themeBtn =
    document.getElementById("themeBtn");

const rtlBtn =
    document.getElementById("rtlBtn");

const homeDropdown =
    document.getElementById("homeDropdown");

const homeToggle =
    document.getElementById("homeToggle");

const mobileHomeBtn =
    document.getElementById("mobileHomeBtn");

const mobileHomeDropdown =
    document.getElementById("mobileHomeDropdown");

const newsletterInput =
    document.getElementById("newsletterInput");

const newsletterButton =
    document.getElementById("newsletterButton");


/* =========================================================
   HEADER SCROLL
========================================================= */

if (header) {

    window.addEventListener(
        "scroll",
        function () {

            if (window.scrollY > 25) {

                header.classList.add("scrolled");

            } else {

                header.classList.remove("scrolled");

            }

        },
        {
            passive: true
        }
    );

}


/* =========================================================
   MOBILE MENU ICON
========================================================= */

function setMenuIcon(open) {

    if (!menuBtn) return;

    menuBtn.innerHTML = open

        ? '<i data-lucide="x"></i>'

        : '<i data-lucide="menu"></i>';

    if (typeof lucide !== "undefined") {
        lucide.createIcons();
    }

    menuBtn.setAttribute(
        "aria-expanded",
        open ? "true" : "false"
    );

}


/* =========================================================
   OPEN MOBILE MENU
========================================================= */

function openMenu() {

    if (!mobilePanel) return;

    mobilePanel.classList.add("active");

    setMenuIcon(true);

}


/* =========================================================
   CLOSE MOBILE MENU
========================================================= */

function closeMenu() {

    if (!mobilePanel) return;

    mobilePanel.classList.remove("active");

    setMenuIcon(false);


    /* Close mobile Home dropdown */

    if (mobileHomeDropdown) {

        mobileHomeDropdown.classList.remove(
            "active"
        );

    }


    if (mobileHomeBtn) {

        mobileHomeBtn.classList.remove(
            "open"
        );

        mobileHomeBtn.setAttribute(
            "aria-expanded",
            "false"
        );

    }

}


/* =========================================================
   TOGGLE MOBILE MENU
========================================================= */

function toggleMenu() {

    if (!mobilePanel) return;

    if (
        mobilePanel.classList.contains(
            "active"
        )
    ) {

        closeMenu();

    } else {

        openMenu();

    }

}


/* =========================================================
   MENU BUTTON
========================================================= */

if (menuBtn) {

    menuBtn.addEventListener(
        "click",
        function (event) {

            event.stopPropagation();

            toggleMenu();

        }
    );

}


/* =========================================================
   DESKTOP HOME DROPDOWN
========================================================= */

if (
    homeToggle &&
    homeDropdown
) {

    homeToggle.addEventListener(
        "click",
        function (event) {

            event.preventDefault();

            event.stopPropagation();

            homeDropdown.classList.toggle(
                "open"
            );

        }
    );

}


/* =========================================================
   MOBILE HOME DROPDOWN
========================================================= */

if (
    mobileHomeBtn &&
    mobileHomeDropdown
) {

    mobileHomeBtn.addEventListener(
        "click",
        function (event) {

            event.preventDefault();

            event.stopPropagation();


            const isOpen =
                mobileHomeDropdown.classList.toggle(
                    "active"
                );


            mobileHomeBtn.classList.toggle(
                "open",
                isOpen
            );


            mobileHomeBtn.setAttribute(
                "aria-expanded",
                isOpen ? "true" : "false"
            );

        }
    );

}


/* =========================================================
   CLOSE DESKTOP DROPDOWN OUTSIDE
========================================================= */

document.addEventListener(
    "click",
    function (event) {

        if (
            homeDropdown &&
            !homeDropdown.contains(
                event.target
            )
        ) {

            homeDropdown.classList.remove(
                "open"
            );

        }

    }
);


/* =========================================================
   MOBILE LINKS
========================================================= */

document
    .querySelectorAll(
        ".mobile-panel > a"
    )
    .forEach(
        function (link) {

            link.addEventListener(
                "click",
                function () {

                    closeMenu();

                }
            );

        }
    );


/* =========================================================
   MOBILE HOME SUBMENU LINKS
========================================================= */

document
    .querySelectorAll(
        ".mobile-dropdown a"
    )
    .forEach(
        function (link) {

            link.addEventListener(
                "click",
                function () {

                    closeMenu();

                }
            );

        }
    );


/* =========================================================
   CLICK OUTSIDE MOBILE PANEL
========================================================= */

document.addEventListener(
    "click",
    function (event) {

        if (
            mobilePanel &&
            mobilePanel.classList.contains(
                "active"
            ) &&

            !mobilePanel.contains(
                event.target
            ) &&

            menuBtn &&
            !menuBtn.contains(
                event.target
            )
        ) {

            closeMenu();

        }

    }
);


/* =========================================================
   ESCAPE KEY
========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Escape"
        ) {

            closeMenu();

            if (homeDropdown) {

                homeDropdown.classList.remove(
                    "open"
                );

            }

        }

    }
);


/* =========================================================
   GLOBAL DARK / LIGHT MODE
=========================================================

   IMPORTANT:

   ALL PAGES USE:

   care-theme

   Do NOT use:
   careHeavenTheme
   care-theme-page
   services-theme
   pricing-theme

========================================================= */


/* Read saved theme */

let darkMode =
    localStorage.getItem(
        "care-theme"
    ) === "dark";


/* =========================================================
   APPLY THEME
========================================================= */

function applyTheme() {

    const root =
        document.documentElement;


    if (darkMode) {

        /* =====================================
           DARK
        ===================================== */

        root.classList.add(
            "dark"
        );

        root.setAttribute(
            "data-theme",
            "dark"
        );


        /* Global CSS variables */

        root.style.setProperty(
            "--bg",
            "#111017"
        );

        root.style.setProperty(
            "--surface",
            "#191720"
        );

        root.style.setProperty(
            "--surface-soft",
            "#211D29"
        );

        root.style.setProperty(
            "--text",
            "#F8F5FA"
        );

        root.style.setProperty(
            "--muted",
            "#B9B2C2"
        );

        root.style.setProperty(
            "--border",
            "rgba(255,255,255,.11)"
        );


        /* Theme icon */

        if (themeBtn) {

            themeBtn.innerHTML =
                '<i data-lucide="sun"></i>';

        }


    } else {

        /* =====================================
           LIGHT
        ===================================== */

        root.classList.remove(
            "dark"
        );

        root.setAttribute(
            "data-theme",
            "light"
        );


        /* Global CSS variables */

        root.style.setProperty(
            "--bg",
            "#FBF8F4"
        );

        root.style.setProperty(
            "--surface",
            "#FFFFFF"
        );

        root.style.setProperty(
            "--surface-soft",
            "#F5F0EA"
        );

        root.style.setProperty(
            "--text",
            "#292535"
        );

        root.style.setProperty(
            "--muted",
            "#777180"
        );

        root.style.setProperty(
            "--border",
            "rgba(91,75,138,.14)"
        );


        /* Theme icon */

        if (themeBtn) {

            themeBtn.innerHTML =
                '<i data-lucide="moon"></i>';

        }

    }


    /* Rebuild Lucide icons */

    if (
        typeof lucide !== "undefined"
    ) {

        lucide.createIcons();

    }

}


/* =========================================================
   APPLY SAVED THEME ON PAGE LOAD
========================================================= */

applyTheme();


/* =========================================================
   THEME BUTTON
========================================================= */

if (themeBtn) {

    themeBtn.addEventListener(
        "click",
        function () {


            /* Toggle */

            darkMode =
                !darkMode;


            /* Save globally */

            localStorage.setItem(
                "care-theme",
                darkMode
                    ? "dark"
                    : "light"
            );


            /* Apply */

            applyTheme();

        }
    );

}


/* =========================================================
   GLOBAL RTL / LTR
=========================================================

   IMPORTANT:

   ALL PAGES USE:

   care-direction

========================================================= */


/* Read saved direction */

let rtlMode =
    localStorage.getItem(
        "care-direction"
    ) === "rtl";


/* =========================================================
   APPLY DIRECTION
========================================================= */

function applyDirection() {

    const root =
        document.documentElement;


    if (rtlMode) {

        root.setAttribute(
            "dir",
            "rtl"
        );

    } else {

        root.setAttribute(
            "dir",
            "ltr"
        );

    }

}


/* =========================================================
   APPLY SAVED DIRECTION ON PAGE LOAD
========================================================= */

applyDirection();


/* =========================================================
   RTL BUTTON
========================================================= */

if (rtlBtn) {

    rtlBtn.addEventListener(
        "click",
        function () {


            /* Toggle RTL */

            rtlMode =
                !rtlMode;


            /* Save globally */

            localStorage.setItem(
                "care-direction",
                rtlMode
                    ? "rtl"
                    : "ltr"
            );


            /* Apply */

            applyDirection();

        }
    );

}


/* =========================================================
   NEWSLETTER
========================================================= */

if (
    newsletterButton &&
    newsletterInput
) {

    newsletterButton.addEventListener(
        "click",
        function () {


            const email =
                newsletterInput.value.trim();


            /* Empty */

            if (!email) {

                newsletterInput.focus();

                newsletterInput.style.outline =
                    "2px solid rgba(232,150,81,.6)";


                setTimeout(
                    function () {

                        newsletterInput.style.outline =
                            "none";

                    },
                    1200
                );

                return;

            }


            /* Basic email validation */

            if (
                !email.includes("@") ||
                !email.includes(".")
            ) {

                newsletterInput.focus();

                return;

            }


            /* Success icon */

            newsletterButton.innerHTML =
                '<i data-lucide="check"></i>';


            if (
                typeof lucide !== "undefined"
            ) {

                lucide.createIcons();

            }


            newsletterInput.value = "";


            /* Restore button */

            setTimeout(
                function () {

                    newsletterButton.innerHTML =
                        '<i data-lucide="arrow-up-right"></i>';


                    if (
                        typeof lucide !== "undefined"
                    ) {

                        lucide.createIcons();

                    }

                },
                2200
            );

        }
    );

}


/* =========================================================
   FOOTER REVEAL
========================================================= */

const footer =
    document.querySelector(
        ".care-footer"
    );


if (
    footer &&
    "IntersectionObserver" in window
) {

    const footerObserver =
        new IntersectionObserver(
            function (entries) {

                entries.forEach(
                    function (entry) {

                        if (
                            entry.isIntersecting
                        ) {

                            footer.style.animation =
                                "footerReveal .9s cubic-bezier(.2,.8,.2,1) both";


                            footerObserver.unobserve(
                                footer
                            );

                        }

                    }
                );

            },
            {
                threshold: 0.08
            }
        );


    footerObserver.observe(
        footer
    );

}


/* =========================================================
   DEMO HASH LINKS
========================================================= */

document
    .querySelectorAll(
        'a[href="#"]'
    )
    .forEach(
        function (link) {

            link.addEventListener(
                "click",
                function (event) {

                    event.preventDefault();

                }
            );

        }
    );


/* =========================================================
   INITIAL MENU STATE
========================================================= */

setMenuIcon(false);


/* =========================================================
   FINAL GLOBAL STATE CHECK
========================================================= */

console.log(
    "Care Companion Theme:",
    darkMode
        ? "Dark"
        : "Light"
);

console.log(
    "Care Companion Direction:",
    rtlMode
        ? "RTL"
        : "LTR"
);

</script>
</body>
</html>
